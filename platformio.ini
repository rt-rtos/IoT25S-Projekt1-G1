; PlatformIO project configuration
; Docs: https://docs.platformio.org/page/projectconf.html
;
; Environments:
;   uno_r4_wifi  firmware for the board (default)
;   native       host build of the pure modules in lib/ plus the tests in
;                test/test_native, run with:  pio test -e native

[platformio]
default_envs = uno_r4_wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
lib_deps =
	arduino-libraries/ArduinoMqttClient@^0.1.8
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^4.0.6
	# hitech-corporation/HiTECH R4 Wifi Manager@^2026.6.20
test_ignore = test_native
; every `pio run` also regenerates compile_commands.json for clangd/IDE use
targets = compiledb, buildprog
extra_scripts = pre:compiledb.py

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -DNATIVE_BUILD
test_filter = test_native
